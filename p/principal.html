<!doctype html>
<html lang="ko">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse's Office</title>
<meta property="og:title" content="🩺 아픈 친구가 왔어요! 처방을 써 주세요">
<meta property="og:description" content="What's wrong? 링크를 눌러 보건 선생님이 되어 주세요. Tap and be the nurse!">
<meta property="og:image" content="https://nursesofficepb.vercel.app/og/principal.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#E3F3EF; --mint2:#C9E9E1; --teal:#2B8C80; --ink:#1E4844; --red:#E5505C;
  --sun:#FFC94A; --paper:#FFFFFF; --line:#9CCFC4; --soft:#F6FBFA; --blue:#3E7FD6;
  --ok:#2EA868; --warn:#F28C28;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--mint);color:var(--ink);font-family:"Nunito","Jua",sans-serif;font-weight:700;font-size:18px;
  background-image:linear-gradient(var(--mint2) 1px,transparent 1px),linear-gradient(90deg,var(--mint2) 1px,transparent 1px);
  background-size:44px 44px}
h1,h2,h3,.ko{font-family:"Jua",sans-serif;font-weight:400}
button{font-family:"Jua",sans-serif;font-size:20px;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;
  background:var(--teal);color:#fff;box-shadow:0 4px 0 #1d6a61;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #1d6a61}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
button.red{background:var(--red);box-shadow:0 4px 0 #b13a44}
button.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #d9a52e}
button.small{font-size:16px;padding:7px 12px;border-radius:10px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:"Nunito",sans-serif;font-size:20px;font-weight:700;padding:10px 12px;border:2px solid var(--line);
  border-radius:12px;background:#fff;color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h2{margin:0;font-size:30px;flex:1}
.panel{background:var(--paper);border-radius:20px;padding:20px;border:2px solid var(--line)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.muted{color:#5d807b;font-weight:600}
.center{text-align:center}
#toast{white-space:pre-line;text-align:center;position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;
  font-family:"Jua";font-size:22px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.on{opacity:1}
.en{display:block;font-family:"Nunito",sans-serif;font-weight:700;font-size:max(.7em,16px);opacity:.78;line-height:1.25;margin-top:2px;letter-spacing:0}
.eni{font-family:"Nunito",sans-serif;font-weight:700;font-size:max(.85em,16px);opacity:.8}
.cross{display:inline-grid;place-items:center;width:1.1em;height:1.1em;background:var(--red);color:#fff;border-radius:.25em;font-size:.9em;line-height:1}

/* picture with emoji fallback */
.pic{display:inline-grid;place-items:center;position:relative}
.pic{overflow:hidden}
.pic img{width:100%;height:100%;min-width:0;min-height:0;object-fit:contain}
.pic i{display:none;font-style:normal;line-height:1}
.pic.noimg img{display:none}
.pic.noimg i{display:grid;place-items:center;width:100%;height:100%}
.pic.med.noimg i{background:var(--c);border-radius:22% 22% 30% 30%;border:3px solid rgba(0,0,0,.12);font-size:.5em}

/* ===== home ===== */
.home{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center;min-height:calc(100vh - 60px)}
.sign{background:linear-gradient(rgba(255,255,255,.86),rgba(255,255,255,.86)),url(img/bg_nurse_office.png) center/cover;border:4px solid var(--teal);border-radius:24px;padding:28px 30px;position:relative}
.sign h1{font-size:64px;margin:0;line-height:1.05}
.sign h1 .cross{font-size:54px;margin-right:10px;vertical-align:6px}
.sign p{font-size:22px;margin:14px 0 0}
.sign .door{margin-top:22px;display:flex;align-items:end;gap:10px}
.sign .door .pic{width:150px;height:150px;font-size:110px}
.menu{display:grid;gap:14px}
.menu button{text-align:left;font-size:26px;padding:18px 22px;display:flex;align-items:center;gap:16px;border-radius:18px}
.menu button small{display:block;font-family:"Nunito";font-size:16px;font-weight:700;opacity:.85;margin-top:2px}
.menu .em{font-size:38px}
.teacher-btn{font-size:15px;opacity:.85}
.credit{text-align:center;margin-top:14px;color:#5d807b;font-size:15px}

/* ===== practice ===== */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.tabs button.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0f2a27}
.words{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.wcard{min-width:0}
.wcard b{max-width:100%;line-height:1.1}
.wrap.bigscreen{max-width:1760px}
.wcard{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px;text-align:center;cursor:pointer;min-height:220px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.wcard .pic{width:120px;height:120px;font-size:84px}
.wcard b{font-size:30px}
.wcard .ko{font-size:22px;color:var(--teal);visibility:hidden}
.wcard.show .ko{visibility:visible}
.match{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start}
.mcol{display:grid;gap:12px}
.mitem{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:24px}
.mitem .pic{width:64px;height:64px;font-size:46px}
.mitem.lit{border-color:var(--red);background:#FFF2F3;transform:scale(1.03)}
.advlist{display:grid;gap:8px;margin-top:8px}
.advlist button{display:flex;justify-content:space-between;gap:12px;font-family:"Nunito",sans-serif;font-weight:900;font-size:22px;text-align:left;padding:10px 14px}
.advlist button .ko{font-family:"Jua";font-weight:400;color:var(--teal);font-size:20px}
/* 전자칠판 화면: 뒷자리에서도 보이게 크게 */
.bigscreen .en{font-size:max(.72em,19px)}
.bigscreen .eni{font-size:max(.85em,19px)}
.bigscreen .top h2{font-size:38px}
.bigscreen .tabs button{font-size:22px}
.bigscreen .wcard{min-height:250px}
.bigscreen .wcard b{font-size:clamp(22px,2.2vw,44px)}
.bigscreen .wcard .ko{font-size:30px}
.bigscreen .wcard .pic{width:clamp(110px,15vh,170px);height:clamp(110px,15vh,170px)}
.bigscreen .wcard{min-height:clamp(220px,33vh,360px)}
.bigscreen .dlg .who{min-width:130px}
.bigscreen .sw-row button{font-size:clamp(16px,2.4vh,22px)}
.bigscreen .dlg{font-size:clamp(28px,4.8vh,50px)}
.bigscreen .dlg .who{font-size:.7em;min-width:4.2em}
.bigscreen .swapper .sw-h{font-size:24px}
.bigscreen .dlg p{line-height:1.45}
.bigscreen .swapper .sw-l{font-size:clamp(20px,3vh,26px)}
.bigscreen .mitem{font-size:28px}
.bigscreen .mitem .pic{width:76px;height:76px}
.bigscreen .rule{font-size:24px}
.bigscreen .big{font-size:56px}
.bigscreen .quiz .big[style]{font-size:40px!important}
.bigscreen .sp-team{font-size:46px}
.bigscreen .sp-bubble{font-size:clamp(30px,5vh,58px)}
.bigscreen .sp-bubble .nm{font-size:26px}
.bigscreen .sp-med{font-size:clamp(18px,2.6vh,28px);min-height:0}
.bigscreen .sp-med .pic{width:clamp(64px,12vh,120px);height:clamp(64px,12vh,120px)}
.bigscreen .sp-ward{min-height:0;padding-block:12px}
.bigscreen .sp-ward > .pic{width:clamp(130px,20vh,220px);height:clamp(150px,26vh,260px)}
.bigscreen .sp-say > .pic{width:clamp(100px,18vh,170px);height:clamp(110px,20vh,190px)}
.bigscreen .sp-go{font-size:clamp(24px,3.6vh,38px);padding:10px 36px}
.bigscreen .sp-top{margin-bottom:8px}
.bigscreen .sp-say-line{font-size:clamp(30px,5vh,58px)}
.bigscreen .sp-say-h{font-size:28px}
.bigscreen .sp-msg{font-size:34px}
.bigscreen .team b{font-size:36px}
.bigscreen .team .t{font-size:40px}
.ac-how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ac-how>div{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 18px}
.ac-how b.ko{font-family:"Jua";font-weight:400;font-size:clamp(28px,4.5vh,44px);display:inline}
.ac-how>div{display:grid;justify-items:center;text-align:center;align-content:center;min-height:clamp(140px,24vh,240px)}
.ac-how .ac-n{margin:0 0 8px}
.ac-how .en{font-size:max(.8em,20px)!important}
.ac-how p{margin:8px 0 0;font-size:19px}
.ac-n{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-family:"Jua";font-size:22px;margin-right:8px;vertical-align:4px}
.ac-tag{font-size:28px;padding:6px 18px;border-radius:999px;justify-self:center}
.ac-tag.sick{background:#FFE0E3}.ac-tag.advice{background:#DDF3EC}.ac-tag.talk{background:#FFF1C9}
.ac-score{text-align:center;font-size:24px;margin-top:14px;background:#FFF8E1;border:2px dashed var(--sun);border-radius:16px;padding:10px 16px}
.ac-score b{color:var(--red)}
.ac-turns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.ac-turns span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-family:"Jua";font-size:22px}
.ac-turns span.top1{border-color:var(--sun);background:#FFF8E1}
.ac-big{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:#fff;border:4px solid var(--sun);border-radius:28px;padding:20px 30px;margin-top:6px}
.ac-big .pic{width:clamp(150px,34vh,330px);height:clamp(150px,34vh,330px);font-size:180px}
.ac-big.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.ac-sent{font-family:"Nunito",sans-serif;font-weight:900;font-size:clamp(48px,10vh,104px);line-height:1.1}
.ac-ko{font-family:"Jua";font-size:clamp(26px,4.5vh,44px);color:var(--teal);margin-top:10px}
.ac-note{text-align:center;font-size:24px;margin-top:10px;color:var(--red)}
.ac-list{display:flex;flex-wrap:wrap;gap:8px}
.ac-list button{font-family:"Nunito",sans-serif;font-weight:900;font-size:22px}
.ac-list button.passed{opacity:.6}
@media (max-width:900px){.ac-how{grid-template-columns:1fr}.ac-big{grid-template-columns:1fr;justify-items:center;text-align:center}}
.talk{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.talk .dlg{padding:24px 28px}
.dlg p.swap span b{color:var(--red)}
.swapper .sw-h{font-size:28px;margin-bottom:0}
.swapper .sw-l{font-family:"Jua";font-size:22px;margin:10px 0 6px}
.sw-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sw-row:not(.adv) button{font-size:18px!important;padding:6px 4px}
.sw-row.adv{grid-template-columns:minmax(0,1fr)}
.sw-row.adv button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.sw-row.adv button .en{display:inline;margin:0;font-size:16px!important;white-space:nowrap}
.sw-row button{padding:8px 10px}
.sw-row button{font-family:"Nunito",sans-serif;font-weight:900;font-size:22px}
@media (max-width:900px){.talk{grid-template-columns:1fr}}
.rule{background:#fff;border-radius:16px;border:3px dashed var(--teal);padding:14px;font-size:22px;line-height:1.8}
.quiz{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:center}
.quiz .pic{width:100%;height:420px;font-size:260px}
.big{font-size:44px;font-family:"Jua";margin:6px 0}
.dlg{font-size:28px;line-height:1.9}
.dlg p{margin:0;display:flex;gap:10px;align-items:center}
.dlg .who{display:inline-block;min-width:96px;font-family:"Jua";color:var(--teal)}

/* ===== game ===== */
.hud{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;background:#fff;border:2px solid var(--line);
  border-radius:18px;padding:10px 16px;margin-bottom:12px}
.gauge{height:26px;background:#FDE3E5;border-radius:999px;overflow:hidden;position:relative;border:2px solid #f3b9be}
.gauge > div{height:100%;background:linear-gradient(90deg,#ff8a95,var(--red));transition:width .4s}
.gauge span{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:#7a1f28}
.hud .pic{width:40px;height:40px;font-size:30px}
.stat{font-family:"Jua";font-size:22px;white-space:nowrap}
.timer{height:10px;border-radius:999px;overflow:hidden;margin-top:6px;background:#E2ECEA}
.timer > div{height:100%;background:var(--sun);transition:width 1s linear}
.timer.low > div{background:var(--red)}
.room{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;min-height:560px}
.ward{border-radius:22px;border:2px solid var(--line);position:relative;overflow:hidden;background:#F2FAF8 center/cover no-repeat;
  display:flex;flex-direction:column;justify-content:flex-end;padding:16px;min-height:560px}
.ward.sports{background-color:#EAF6E2}
.patient{display:flex;align-items:flex-end;gap:10px}
.patient .pic{width:250px;height:300px;font-size:200px;flex:none}
.patient.enter .pic{animation:walk .5s ease-out}
@keyframes walk{from{transform:translateX(-120px);opacity:0}to{transform:none;opacity:1}}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px 18px;font-size:27px;line-height:1.5;margin-bottom:200px;
  position:relative;flex:1;font-family:"Nunito";font-weight:800}
.bubble:after{content:"";position:absolute;left:-16px;bottom:24px;border:14px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble .nm{display:block;font-family:"Jua";font-size:18px;color:var(--teal);font-weight:400}
.hl-s{background:#FFE0E3;border-radius:6px;padding:0 3px}
.hl-f{background:#DDEBFF;border-radius:6px;padding:0 3px}
.hl-n{background:#FFE7C2;border-radius:6px;padding:0 3px}
.nurse{display:flex;align-items:center;gap:10px;position:absolute;right:14px;top:14px}
.nurse .pic{width:110px;height:130px;font-size:90px}
.nurse .say{background:var(--teal);color:#fff;border-radius:18px;padding:10px 14px;font-family:"Nunito";font-weight:800;font-size:21px;max-width:340px}
.desk{display:flex;flex-direction:column;gap:12px}
.box{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px}
.box h3{margin:0 0 10px;font-size:24px;display:flex;align-items:center;gap:8px}
.box h3 .step{background:var(--ink);color:#fff;border-radius:999px;width:30px;height:30px;display:inline-grid;place-items:center;font-size:18px}
.cabinet{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#EAF4F2;border-radius:14px;padding:10px;border:3px solid #cfe4df}
.medbtn{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:8px 4px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;gap:4px;font-family:"Nunito";font-weight:900;font-size:14px;line-height:1.15;position:relative;min-height:150px}
.medbtn .pic{width:66px;height:76px;font-size:66px}
.medbtn.sel{background:#FFF6D6;box-shadow:0 4px 0 #d9a52e;outline:3px solid var(--sun)}
.medbtn .stock{position:absolute;top:4px;right:6px;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px}
.medbtn.empty{opacity:.35}
.advs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.advbtn{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;
  font-family:"Nunito";font-weight:900;font-size:19px;padding:10px}
.advbtn .pic{width:70px;height:70px;font-size:54px}
.advbtn.sel{background:#FFF6D6;outline:3px solid var(--sun);box-shadow:0 4px 0 #d9a52e}
.locked{opacity:.4;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.banner{position:fixed;inset:0;background:rgba(30,72,68,.55);display:grid;place-items:center;z-index:50}
.banner .card{background:#fff;border-radius:26px;padding:30px 40px;text-align:center;border:5px solid var(--sun);max-width:640px}
.banner .card h2{font-size:44px;margin:0 0 10px}
.banner .card p{font-size:22px}
.chips{display:flex;gap:10px;margin-bottom:10px}
.chip{background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:"Jua";font-size:20px}
.chip .pic{width:56px;height:56px;font-size:44px}
.chip.on{border-color:var(--sun);background:#FFF8E1}
.chip.done{opacity:.5}
.pair{font-size:16px;color:#5d807b}
.result{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.result .score{font-size:80px;font-family:"Jua";color:var(--red);line-height:1}
.lb li{font-size:22px;margin:4px 0}

/* ===== writing ===== */
.wgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.av{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:6px;border-radius:14px}
.av .pic{width:100%;height:84px;font-size:62px}
.av.sel{outline:4px solid var(--sun);background:#FFF8E1}
.syms{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.symbtn{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:"Nunito";font-weight:900;font-size:17px;padding:8px 4px}
.symbtn .e{font-size:34px}
.symbtn.sel{outline:4px solid var(--red);background:#FFF2F3}
.wline{display:flex;align-items:center;gap:8px;margin:8px 0}
.wline input{flex:1}
.bank{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;max-height:40vh;overflow:auto}
.bank-items{display:flex;flex-wrap:wrap;gap:6px}
.bank-i{background:#F6FBFA;color:var(--ink);box-shadow:0 3px 0 var(--line);padding:6px 10px;border-radius:12px;display:grid;text-align:left;font-size:16px}
.bank-i b{font-family:"Nunito",sans-serif;font-weight:900;font-size:17px}
.bank-i span{font-family:"Jua";font-size:14px;color:#5d807b}
.copy-guide{background:#FFF8E1;border:2px dashed var(--sun);border-radius:12px;padding:8px 12px;font-family:"Jua";font-size:20px;margin:6px 0}
.copy-guide b{font-family:"Nunito",sans-serif;font-weight:900}
.rlabel{font-size:18px;margin:10px 0 0}
.spellbox{background:#FFF2F3;border:2px solid #f3b9be;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:17px;line-height:1.5}
.spellbox b{font-family:"Nunito",sans-serif;font-weight:900;color:var(--red)}
.myreps{grid-column:1 / -1}
.myrep{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px dashed var(--line);padding:8px 0}
.myrep .pic{width:52px;height:52px;font-size:40px}
.myrep div div{font-family:"Nunito",sans-serif;font-weight:800;font-size:17px}
.editor{max-width:760px;width:calc(100vw - 32px);text-align:left}
.editor h2{font-size:26px}
.editor h2 .eni{font-size:18px!important;display:block}
.ed-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0}
.ed-row input{width:100%}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}

<script>
/* =========================================================
   Nurse's Office (보건실)
   5학년 영어 11단원 I Have a Headache · 만든 이: Tr. Olivia
   ========================================================= */
/* ---------- data ---------- */
const SYM = {
  cold:        { en:'cold',        ko:'감기', kid:'kid1', emoji:'🤧', act:'콜록콜록 기침하며' },
  fever:       { en:'fever',       ko:'열',   kid:'kid2', emoji:'🤒', act:'이마에 손을 대며' },
  headache:    { en:'headache',    ko:'두통', kid:'kid3', emoji:'🤕', act:'머리를 감싸며' },
  runnynose:   { en:'runny nose',  ko:'콧물', kid:'kid4', emoji:'💧', act:'코를 훌쩍이며' },
  stomachache: { en:'stomachache', ko:'복통', kid:'kid5', emoji:'😣', act:'배를 잡으며' }
};
const SYM_KEYS = Object.keys(SYM);
const FEEL = {
  tired:   { en:'tired',   ko:'피곤한', emoji:'🥱', act:'하품하며' },
  thirsty: { en:'thirsty', ko:'목마른', emoji:'🥵', act:'목을 만지며' }
};
const MEDS = {
  cold:        { name:'Cold Medicine',        ko:'감기약',     img:'med_cold',        color:'#9cc8ff', mark:'❄️' },
  fever:       { name:'Fever Medicine',       ko:'해열제',     img:'med_fever',       color:'#ffa3a3', mark:'🌡️' },
  headache:    { name:'Headache Medicine',    ko:'두통약',     img:'med_headache',    color:'#ffe07a', mark:'⚡' },
  runnynose:   { name:'Runny Nose Medicine',  ko:'콧물약',     img:'med_runnynose',   color:'#c7a6e8', mark:'🧻' },
  stomachache: { name:'Stomachache Medicine', ko:'배 아플 때 약', img:'med_stomachache', color:'#f7b6c8', mark:'🍵' }
};
const ADV = {
  rest:     { en:'Get some rest.',      ko:'푹 쉬어.',        img:'adv_rest',     emoji:'🛏️' },
  sleep:    { en:'Get some sleep.',     ko:'잠 좀 자.',       img:'adv_sleep',    emoji:'😴' },
  water:    { en:'Drink warm water.',   ko:'따뜻한 물을 마셔.', img:'adv_water',    emoji:'☕' },
  doctor:   { en:'Go see a doctor.',    ko:'병원에 가 봐.',    img:'adv_doctor',   emoji:'🏥' },
  wellsoon: { en:'Get well soon.',      ko:'얼른 나아.',       img:'adv_wellsoon', emoji:'🌈' },
  vitamins: { en:'Take some vitamins.', ko:'비타민 좀 먹어.',  img:'adv_vitamins', emoji:'🍊' }
};
const advKeys = a => ADV[a].en.replace(/[.]/g, '').split(' ').filter(w => !['some', 'a', 'Go', 'Get', 'Take'].includes(w));
const adviceFor = f => f === 'tired' ? 'sleep' : f === 'thirsty' ? 'water' : 'rest';
const nurseLine = adv => `That's too bad. Take this medicine. ${ADV[adv].en}`;

const AVATARS = [
  { id:'kid1', emoji:'👦' }, { id:'kid2', emoji:'👧' }, { id:'kid3', emoji:'🧒' },
  { id:'kid4', emoji:'👧' }, { id:'kid5', emoji:'👦' }, { id:'kid6', emoji:'👩' },
  { id:'principal', emoji:'👴' }, { id:'cook', emoji:'👩‍🍳' }, { id:'snowman', emoji:'☃️' },
  { id:'robot', emoji:'🤖' }, { id:'dino', emoji:'🦖' }, { id:'alien', emoji:'👽' },
  { id:'ghost', emoji:'👻' }, { id:'penguin', emoji:'🐧' }, { id:'hero', emoji:'🦸' }
];
const KID_SICK = { kid1:'cold', kid2:'fever', kid3:'headache', kid4:'runnynose', kid5:'stomachache', kid6:'tired' };
function avImg(id, mood) {
  if (id && id.startsWith('kid')) return mood === 'happy' ? `${id}_happy` : `${id}_${KID_SICK[id]}`;
  if (id === 'snowman') return mood === 'happy' ? 'guest_snowman_happy' : 'guest_snowman';
  return 'guest_' + id;
}
const avEmoji = id => (AVATARS.find(a => a.id === id) || { emoji:'🙂' }).emoji;

/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function pic(name, emoji, cls = '', style = '') {
  return `<span class="pic ${cls}" style="${style}"><img src="img/${name}.png" alt="" onerror="this.parentNode.classList.add('noimg')"><i>${emoji}</i></span>`;
}
const medPic = (k, style = '') => pic(MEDS[k].img, MEDS[k].mark, 'med', `--c:${MEDS[k].color};${style}`);
function toast(msg, ms = 1800) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');

}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .88;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en-US'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function norm(s) {
  return String(s || '').toLowerCase().replace(/[’‘`]/g, "'")
    .replace(/\bi am\b/g, "i'm").replace(/\bthat is\b/g, "that's")
    .replace(/[^a-z' ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function tidy(s) {
  s = String(s || '').trim().replace(/\s+/g, ' ');
  if (!s) return s;
  s = s[0].toUpperCase() + s.slice(1);
  s = s.replace(/\bi\b/g, 'I').replace(/\bi'm\b/gi, "I'm");
  if (!/[.!?]$/.test(s)) s += '.';
  return s;
}
function parseNumbers(txt) {
  const out = [];
  String(txt || '').split(/[,\s]+/).forEach(p => {
    const m = p.match(/^(\d+)-(\d+)$/);
    if (m) { for (let i = +m[1]; i <= +m[2] && out.length < 200; i++) out.push(i); }
    else if (/^\d+$/.test(p)) out.push(+p);
  });
  return [...new Set(out)].sort((a, b) => a - b);
}
function hl(line) {
  let h = esc(line);
  const words = [...SYM_KEYS.map(k => SYM[k].en), 'tired', 'thirsty'].sort((a, b) => b.length - a.length);
  words.forEach(w => {
    const cls = (w === 'tired' || w === 'thirsty') ? 'hl-f' : 'hl-s';
    h = h.replace(new RegExp(`\\b(${w})\\b`, 'gi'), `<span class="${cls}">$1</span>`);
  });
  return h.replace(/\b(don't|not)\b/gi, '<span class="hl-n">$1</span>');
}

function nurseTips(lines) {
  const out = [], t = (lines || []).join(' ');
  let m;
  if ((m = t.match(/I ate too much ([A-Za-z ]+?)\./i))) out.push([`Don't eat too much ${m[1]}.`, '너무 많이 먹지 마.']);
  if ((m = t.match(/I ate too many ([A-Za-z ]+?)\./i))) out.push([`Don't eat too many ${m[1]}.`, '너무 많이 먹지 마.']);
  if (/went to bed late|can't sleep/i.test(t)) out.push(['Go to bed early.', '일찍 자.']);
  if (/games all night/i.test(t)) out.push(["Don't play games all night.", '밤새 게임하지 마.']);
  if (/snow|rain|coat|feel cold/i.test(t)) out.push(['Wear a warm coat.', '따뜻한 외투를 입어.']);
  if (/wash my hands/i.test(t)) out.push(['Wash your hands.', '손을 씻어.']);
  if (/cold water/i.test(t)) out.push(['Drink warm water.', '따뜻한 물을 마셔.']);
  if (/ran very fast|thirsty/i.test(t)) out.push(['Drink warm water.', '따뜻한 물을 마셔.']);
  if (/tired|dizzy/i.test(t)) out.push(['Get some sleep.', '잠 좀 자.']);
  if (/lie down/i.test(t)) out.push(['Lie down here.', '여기 누워.']);
  return out.filter((x, i, a) => a.findIndex(y => y[0] === x[0]) === i);
}

/* ---- 문진표 ↔ 링크 (서버 없이 주소 안에 담아요) ---- */
const b64e = t => btoa(unescape(encodeURIComponent(t))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = t => decodeURIComponent(escape(atob(t.replace(/-/g, '+').replace(/_/g, '/'))));
const strHash = t => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) | 0; return 'f' + (h >>> 0).toString(36); };
function encForm(f) { return b64e(JSON.stringify({ a: f.avatar, g: f.guest_name, s: f.symptoms, l: f.card_lines })); }
function decForm(t) {
  try {
    const o = JSON.parse(b64d(t));
    const avatar = AVATARS.some(a => a.id === o.a) ? o.a : 'kid1';
    const g = String(o.g || '');
    const s = (Array.isArray(o.s) ? o.s : []).filter(k => SYM_KEYS.includes(k)).slice(0, 4);
    const l = (Array.isArray(o.l) ? o.l : []).map(x => String(x).slice(0, 80)).filter(x => /^[A-Za-z0-9 ,.'!?-]+$/.test(x)).slice(0, 8);
    if (!/^[A-Za-z][A-Za-z .'-]{0,14}$/.test(g) || !s.length || !l.length) return null;
    return { id: strHash(t), avatar, guest_name: g, symptoms: s, card_lines: l };
  } catch (e) { return null; }
}

function wrapText(x, text, maxW) {
  const out = []; let cur = '';
  text.split(' ').forEach(w => { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; });
  if (cur) out.push(cur);
  return out;
}
async function drawForm(cv, f) {
  const Wd = 1000, Ht = 640, x = cv.getContext('2d');
  cv.width = Wd; cv.height = Ht;
  try { await document.fonts.ready; } catch (e) {}
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  x.fillStyle = '#E3F3EF'; x.fillRect(0, 0, Wd, Ht);
  rr(20, 20, Wd - 40, Ht - 40, 28); x.fillStyle = '#fff'; x.fill(); x.lineWidth = 6; x.strokeStyle = '#2B8C80'; x.stroke();
  rr(20, 20, Wd - 40, 84, 28); x.fillStyle = '#2B8C80'; x.fill(); x.fillRect(20, 76, Wd - 40, 28);
  x.fillStyle = '#fff'; x.font = '900 40px Nunito, sans-serif'; x.textBaseline = 'middle';
  x.fillText("✚ Patient Form", 50, 62);
  x.font = '30px Jua, sans-serif'; x.textAlign = 'right'; x.fillText("Nurse's Office · 문진표", Wd - 50, 62); x.textAlign = 'left';
  // 손님 그림

  const ok = await new Promise(r => { img.onload = () => r(true); img.onerror = () => r(false); });
  if (ok) { const s = Math.min(270 / img.width, 300 / img.height); x.drawImage(img, 50 + (270 - img.width * s) / 2, 140 + (300 - img.height * s) / 2, img.width * s, img.height * s); }
  else { x.font = '200px serif'; x.fillText(avEmoji(f.avatar), 60, 300); }
  // 문장
  x.fillStyle = '#1E4844'; x.font = '800 34px Nunito, sans-serif';
  let y = 150; const lh = 46;
  for (const ln of f.card_lines) for (const part of wrapText(x, ln, 610)) { if (y > 520) break; x.fillText(part, 350, y); y += lh; }
  // 증상 칩

    x.fillStyle = '#E5505C'; x.fillText(t, cx + 18, 571); cx += w + 12;
  }
}

function drawQR(box, text, size) {

  const n = q.getModuleCount(), cell = Math.floor(size / (n + 4)), cv = document.createElement('canvas');
  cv.width = cv.height = cell * (n + 4); const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect((c + 2) * cell, (r + 2) * cell, cell, cell);
  box.appendChild(cv);
}

function editDist(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
      i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1] ? d[i - 2][j - 2] + 1 : 99);
  return d[a.length][b.length];
}

    'played ate drank ran went fell slept watched studied stayed walked swam rode cried sneezed coughed ' +

function suggest(w) {
  if (!DICT) return [];
  const C = commonWords(), out = [];
  for (const x of DICT) { if (Math.abs(x.length - w.length) > 2) continue; const k = editDist(w, x); if (k <= 2) out.push([k - (C.has(x) ? 1.5 : 0), x]); }
  return out.sort((a, b) => a[0] - b[0] || Math.abs(a[1].length - w.length) - Math.abs(b[1].length - w.length)).slice(0, 3).map(x => x[1]);
}
function wordOK(raw, first) {
  if (!DICT) return true;
  if (!first && /^[A-Z]/.test(raw)) return true;         // 이름 같은 고유명사는 통과
  let w = raw.toLowerCase().replace(/’/g, "'");
  if (DICT.has(w)) return true;
  w = w.replace(/'(s|m|re|ll|ve|d)$/, '').replace(/n't$/, '');
  return DICT.has(w) || w === 'i';
}

const JUNK = [
  [/(^|\D)6\s*[-~.,]?\s*7(\D|$)/, '67'],
  [/\bsix\s*-?\s*seven\b|sixseven/i, 'six seven'],
  [/([a-z])\1{3,}/i, '같은 글자 반복'],
  [/\b(\w+)\b(?:\W+\1\b){2,}/i, '같은 말 반복'],

function englishIssues(texts) {
  const issues = [];

  texts.filter(Boolean).forEach(t => {

    GRAMMAR.forEach(([re, fix, ko]) => { const m = t.match(re); if (m) { issues.push(`📝 <b>${esc(m[0])}</b> → <b>${esc(fix)}</b> · ${esc(ko)}`); m[0].toLowerCase().split(/\s+/).forEach(x => flagged.add(x)); } });

// 그림 속 아이와 어울리는 이름 (kid1·3·5 남자, kid2·4·6 여자)
const SP_NAMES = {
  boy:  ['Minho', 'Junho', 'Jihun', 'Tom', 'Ben', 'Max', 'Leo', 'Sam'],
  girl: ['Jia', 'Sora', 'Yuna', 'Hana', 'Emma', 'Lily', 'Mia', 'Ella']
};
const KID_GIRL = new Set(['kid2', 'kid4', 'kid6']);
const SP_KIDS = ['kid1','kid2','kid3','kid4','kid5','kid6'];
const SP_OPEN = ['Hi.', 'Hello.', "I'm sick.", 'Hello, nurse.'];
const SP_CAUSE = ['I played outside.', 'I went to bed late.', 'I ate ice cream.', 'I ate too much pizza.', 'I played in the snow.', 'I ran very fast.'];

function spPatient(n, used) {
  const pickSyms = shuffle(SYM_KEYS).slice(0, n);
  const lines = [];
  if (Math.random() < .6) lines.push(shuffle(SP_OPEN)[0]);
  if (n >= 2 && Math.random() < .6) lines.push(shuffle(SP_CAUSE)[0]);
  const s = pickSyms, A = s.map(a_);
  const joinA = xs => xs.length === 1 ? xs[0] : xs.length === 2 ? `${xs[0]} and ${xs[1]}` : `${xs.slice(0, -1).join(', ')}, and ${xs[xs.length - 1]}`;
  const list = joinA(A);
  const trapOn = n >= 2 ? Math.random() < .65 : Math.random() < .4;
  const trap = trapOn ? `I don't have ${a_(shuffle(SYM_KEYS.filter(k => !s.includes(k)))[0])}.` : null;
  const style = Math.random();
  let symLines;
  if (trap && style < .5) {
    // I don't have a headache. But I have a fever (and a cold).
    symLines = [trap, `But I have ${list}.`];
  } else if (n >= 2 && style < .75) {
    // I have a cold. And I have a fever, too.
    const head = joinA(A.slice(0, -1));
    symLines = [`I have ${head}.`, `And I have ${A[n - 1]}, too.`];
    if (trap) symLines.push(`But I don't have ${trap.slice(13, -1)}.`);
  } else {
    // I have a cold and a fever. But I don't have a headache.
    symLines = [`I have ${list}.`];
    if (trap) symLines.push(`But I don't have ${trap.slice(13, -1)}.`);
  }
  lines.push(...symLines);
  let feel = null;
  if (Math.random() < .5) { feel = Math.random() < .5 ? 'tired' : 'thirsty'; const lastAnd = /^And /.test(lines[lines.length - 1]); lines.push(!lastAnd && Math.random() < .5 ? `And I'm ${feel}.` : `I'm ${feel}, too.`); }

  const adv = feel ? adviceFor(feel) : n >= 3 ? 'doctor' : shuffle(['rest', 'wellsoon', 'vitamins'])[0];

}
function spRound(count) {

  const used = new Set();
  const list = plan.map(n => spPatient(n, used));
  const f = shuffle(SP_FEAT || []).find(c => (c.symptoms || []).some(k => SYM[k]));
  if (f && list.length >= 3) {

      lines: (f.card_lines || []).slice(), sym: f.symptoms.filter(k => SYM[k]), feel: f.feel || null, friend: true };
  }

}

      <button class="red sp-go" onclick="spStart(${SP.cur})">${SP.cur}모둠 진료 시작 ▶<span class="en">Start Team ${SP.cur}</span></button></div>
  </div>`;
}
function spSettings() {
  uiModal(`<h2>⚙️ 설정 <span class="eni">Settings</span></h2>
    <p class="row" style="justify-content:center">모둠 수 <span class="eni">Teams</span> <input id="setT" type="number" min="2" max="10" value="${SP.teams}" style="width:90px"></p>
    <p class="row" style="justify-content:center">모둠별 손님 수 <span class="eni">Patients</span> <input id="setP" type="number" min="3" max="12" value="${SP.per}" style="width:90px"></p>
    <label class="row" style="justify-content:center;font-size:18px"><input id="setC" type="checkbox"> 지금까지 기록 지우기 <span class="eni">Clear records</span></label>`,
    () => {
      SP.teams = Math.min(10, Math.max(2, +document.getElementById('setT').value || 6));
      SP.per = Math.min(12, Math.max(3, +document.getElementById('setP').value || 12));
      if (document.getElementById('setC').checked) SP.results = {};
      if (SP.cur > SP.teams) SP.cur = 1;
      spSave(); speedSetup();
    }, '저장<span class="en">Save</span>');
}
let SPG = null;
function spStart(team) {
  const go = () => {
    SPG = { team, list: spRound(SP.per), i: 0, sel: new Set(), miss: 0, pen: 0, t0: performance.now(), paused: 0, pauseAt: null, msg: '', state: 'play' };
    spDraw();
    stopTimer(); TMR = setInterval(spTick, 100);
  };
  if (SP.results[team] && !spStart._ok) { uiConfirm(`${team}모둠은 이미 기록이 있어요. 다시 할까요?\nTeam ${team} has a record. Play again?`, () => { spStart._ok = true; spStart(team); }); return; }
  spStart._ok = false;
  // 3·2·1 카운트다운
  let n = 3;
  $app.innerHTML = `<div class="wrap bigscreen"><div class="center" style="padding-top:120px"><div class="sp-team">${team}모둠 준비!<span class="en">Team ${team}, get ready!</span></div><div class="sp-clock" style="text-align:center;font-size:160px" id="cd">3</div></div></div>`;
  const cd = setInterval(() => { n--; const e = document.getElementById('cd'); if (n <= 0) { clearInterval(cd); go(); } else if (e) e.textContent = n; }, 800);
}
function spElapsed() {
  const now = SPG.pauseAt ?? performance.now();
  return (now - SPG.t0 - SPG.paused) / 1000 + SPG.pen;
}
function spTick() { const e = document.getElementById('spc'); if (e && SPG) e.firstChild.nodeValue = fmt(spElapsed()); }
function spDraw(flash) {
  const g = SPG, p = g.list[g.i], done = g.state === 'ok';
  const lines = p.lines.map(l => done ? hl(l) : esc(l)).join(' ');
  const say = nurseLine(p.adv || adviceFor(p.feel));
  const head = g.practice
    ? `<div class="row"><button class="ghost small" onclick="stopTimer();SPG=null;home()">← 처음 <span class="eni">Home</span></button><div class="sp-team">연습<span class="en">Practice</span></div></div>`
    : `<div class="sp-team">${g.team}모둠<span class="en">Team ${g.team}</span></div>`;
  const clock = g.practice
    ? `<div class="sp-clock" style="font-size:28px;color:var(--teal)">⏱️ 시간 재지 않아요<small style="color:var(--teal)">No timer</small></div>`
    : `<div class="sp-clock" id="spc">${fmt(spElapsed())}<small>${g.pen ? `벌칙 +${g.pen}초 · +${g.pen} sec` : ''}</small></div>`;
  $app.innerHTML = `<div class="wrap bigscreen">
    <div class="sp-top">${head}
      <div class="dots">${g.list.map((_, k) => `<span class="${k < g.i || (k === g.i && done) ? 'ok' : k === g.i ? 'on' : ''}"></span>`).join('')}</div>
      ${clock}
    </div>
    <div class="sp-ward ${flash ? 'shake' : ''}">
      ${pic(done ? p.happy : p.img, done ? '😊' : '🤒')}
      <div class="sp-bubble"><span class="nm">${p.friend ? '✉️ 친구가 만든 손님 (Made by a friend) · ' : ''}${esc(p.name)} · What's wrong?</span>${lines}</div>
    </div>
    ${done ? `<div class="sp-say">
        ${pic('nurse', '👩‍⚕️')}
        <div><div class="ko sp-say-h">✅ 정답! 보건 선생님이 되어 다 같이 말해요 <span class="eni">Correct! Say it together as the nurse.</span></div>
          <div class="sp-say-meds">${p.sym.map(k => `<span>${medPic(k)}${MEDS[k].name}</span>`).join('')}</div>
          <div class="sp-say-line">${esc(say)}</div>
          <button class="ghost small" onclick='speak(${esc(JSON.stringify(say))})'>🔊 듣기 · Listen</button></div>
      </div>`
    : `<div class="sp-cab">${SYM_KEYS.map((k, n) => `<button class="sp-med ${g.sel.has(k) ? 'sel' : ''}" onclick="spMed('${k}')">
      <span class="no">${n + 1}</span>${medPic(k)}${MEDS[k].name}</button>`).join('')}</div>
    <div class="sp-msg" style="margin-top:12px">${esc(g.msg)}</div>`}
    <div class="center" style="margin-top:10px">
      ${done ? `<button class="sun sp-go" onclick="spNext()">${g.i + 1 < g.list.length ? '다음 손님 ▶<span class="en">Next patient</span>' : (g.practice ? '한 번 더 ▶<span class="en">Again</span>' : '진료 끝! ▶<span class="en">Finish</span>')}</button>`
             : `<button class="red sp-go" onclick="spGive()" ${g.sel.size ? '' : 'disabled'}>💊 약 주기<span class="en">Give medicine</span></button>
                ${g.practice ? '' : `<button class="ghost small" style="margin-left:10px" onclick="spQuit()">그만하기<span class="en">Stop</span></button>`}`}
    </div></div>`;
}
function spPractice() {
  stopTimer();
  SPG = { practice: true, team: 0, list: spRound(5), i: 0, sel: new Set(), miss: 0, pen: 0, t0: performance.now(), paused: 0, pauseAt: null, msg: '', state: 'play' };
  spDraw();
}
function spMed(k) {
  if (!SPG || SPG.state !== 'play') return;
  SPG.sel.has(k) ? SPG.sel.delete(k) : SPG.sel.add(k);
  SPG.msg = ''; spDraw();
}
function spGive() {
  const g = SPG, p = g.list[g.i];
  const right = g.sel.size === p.sym.length && p.sym.every(s => g.sel.has(s));
  if (right) {
    g.state = 'ok'; g.pauseAt = performance.now(); g.msg = '';
    spDraw(); speak(nurseLine(p.adv || adviceFor(p.feel)));
  } else {
    g.miss++; g.sel = new Set();
    if (g.practice) g.msg = '❌ 다시 꼼꼼히 읽어 보세요 · Read carefully again.';
    else { g.pen += 5; g.msg = '❌ +5초! 다시 꼼꼼히 읽어 보세요 · +5 sec! Read carefully again.'; }
    spDraw(true);
  }
}
function spNext() {
  const g = SPG;
  g.paused += performance.now() - g.pauseAt; g.pauseAt = null;
  if (g.i + 1 >= g.list.length) return g.practice ? spPractice() : spFinish();
  g.i++; g.sel = new Set(); g.state = 'play'; g.msg = '';
  spDraw();
}
function spQuit() { uiConfirm('이 모둠 진료를 그만할까요? (기록되지 않아요)\nStop this team? (Not recorded)', () => { stopTimer(); SPG = null; speedSetup(); }); }
function spFinish() {
  stopTimer();
  const g = SPG, total = spElapsed();
  SP.results[g.team] = { total, miss: g.miss };
  const ranked = Object.entries(SP.results).sort((a, b) => a[1].total - b[1].total);
  const place = ranked.findIndex(r => +r[0] === g.team) + 1;
  SP.cur = g.team % SP.teams + 1; spSave();
  $app.innerHTML = `<div class="wrap bigscreen"><div class="panel center" style="max-width:820px;margin:30px auto">
    <div class="sp-team">${g.team}모둠 진료 완료!<span class="en">Team ${g.team} finished!</span></div>
    <div class="sp-clock" style="text-align:center;font-size:110px;margin:10px 0">${fmt(total)}</div>
    <p class="ko" style="font-size:26px">벌칙 ${g.miss}번 (+${g.pen}초) · 지금까지 ${place}등<span class="en">${g.miss} miss (+${g.pen} sec) · Now #${place}</span></p>
    <div class="panel" style="background:var(--soft);font-size:30px;font-family:Nunito;font-weight:900;margin:16px 0">
      <div class="ko muted" style="font-size:20px">다 같이 읽어요 · Read together</div>That's too bad.<br>Take this medicine and get some rest.</div>
    <button class="sun sp-go" onclick="speedSetup()">모둠판으로 ▶<span class="en">Team board</span></button></div></div>`;
}
function spRank() {
  const ranked = Object.entries(SP.results).sort((a, b) => a[1].total - b[1].total);
  $app.innerHTML = `<div class="wrap bigscreen"><div class="panel" style="max-width:760px;margin:30px auto">
    <h2 class="center" style="font-size:44px;margin-top:0">🏆 명예 보건 선생님<span class="en" style="font-size:.5em">Best School Nurses</span></h2>
    <ol class="rank">${ranked.map(([t, r], i) => `<li>${['🥇','🥈','🥉'][i] || ''} ${t}모둠 Team ${t} · ${fmt(r.total)} <span class="muted" style="font-size:22px">(벌칙 · miss ${r.miss})</span></li>`).join('')}</ol>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="ghost" onclick="speedSetup()">모둠판으로<span class="en">Team board</span></button>
      <button class="red small" onclick="uiConfirm('기록을 모두 지울까요?\\nClear all records?',()=>{SP.results={};SP.cur=1;spSave();speedSetup()})">기록 지우기<span class="en">Clear</span></button></div>
  </div></div>`;
}

/* =========================================================
   몸으로 말해요 (반 전체 도전, 전자칠판, 서버 저장 없음)
   앉은 학생들이 화면 문장을 몸으로 표현 → 앞에 나온 도전자가 영어 문장으로 맞히기
   ========================================================= */
const AC_POOL = [
  ...SYM_KEYS.map(k => ({ en: `I have a ${SYM[k].en}.`, ko: { cold: '감기에 걸렸어요.', fever: '열이 나요.', headache: '머리가 아파요.', runnynose: '콧물이 나요.', stomachache: '배가 아파요.' }[k], img: `${SYM[k].kid}_${k}`, emoji: SYM[k].emoji, type: 'sick' })),
  { en: "I'm tired.", ko: '피곤해요.', img: 'word_tired', emoji: '🥱', type: 'sick' },
  { en: "I'm thirsty.", ko: '목말라요.', img: 'word_thirsty', emoji: '🥵', type: 'sick' },
  { en: 'Take this medicine.', ko: '이 약 좀 먹어.', img: 'med_headache', emoji: '💊', type: 'advice' },
  ...Object.keys(ADV).map(k => ({ en: ADV[k].en, ko: ADV[k].ko, img: ADV[k].img, emoji: ADV[k].emoji, type: 'advice' })),
  { en: "What's wrong?", ko: '어디가 아프니?', img: 'nurse_worried', emoji: '❓', type: 'talk' },
  { en: "That's too bad.", ko: '그것 참 안됐구나.', img: 'nurse_m_worried', emoji: '😢', type: 'talk' },
  { en: "I'm sick.", ko: '나 아파.', img: 'kid1_cold', emoji: '🤒', type: 'talk' }
];
let AC = { time: 120, cls: 1, mode: 'class', turns: [] };
let ACG = null;
// 기록: 시간 안에 맞힌 개수(n). 모두 맞히면 걸린 시간(t초)도 기록 → 모두 맞힌 기록이 더 높고, 그중엔 빠른 게 이김
const acBest = cls => { try { const v = JSON.parse(localStorage.getItem('hn_ac_best2_' + cls)); return v && typeof v.n === 'number' ? v : null; } catch (e) { return null; } };
const acSetBest = (cls, v) => { try { localStorage.setItem('hn_ac_best2_' + cls, JSON.stringify(v)); } catch (e) {} };
const acBetter = (a, b) => !b || (a.t != null ? (b.t == null || a.t < b.t) : (b.t == null && a.n > b.n));
const acFmt = r => !r ? '아직 없어요 · None yet' : r.t != null ? `${r.n}문장 모두 · ${r.t}초 <span class="eni">All ${r.n} in ${r.t}s</span>` : `${r.n}개 <span class="eni">${r.n} correct</span>`;
let SFX = null;
function sfx(kind) {
  try {
    SFX = SFX || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = SFX, t0 = ctx.currentTime;
    const tone = (f, start, dur, type = 'sine', vol = .25) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0 + start);
      g.gain.setValueAtTime(0, t0 + start); g.gain.linearRampToValueAtTime(vol, t0 + start + .01);
      g.gain.exponentialRampToValueAtTime(.001, t0 + start + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t0 + start); o.stop(t0 + start + dur + .02);
    };
    if (kind === 'ok') { tone(880, 0, .15, 'triangle'); tone(1320, .12, .28, 'triangle'); }
    else if (kind === 'pass') { tone(180, 0, .35, 'square', .16); tone(140, .05, .35, 'square', .12); }
    else if (kind === 'end') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3, 'triangle')); }
  } catch (e) {}
}
function acSetup() {
  stopTimer(); ACG = null; AC.mode = 'class';
  $app.innerHTML = `<div class="wrap bigscreen">
    <div class="top"><button class="ghost small" onclick="home()">← 처음 <span class="eni">Home</span></button><h2>🎭 몸으로 말해요<span class="en">Act It Out</span></h2></div>
    <div class="ac-how">
      <div><span class="ac-n">1</span><b class="ko">도전자 앞으로!</b><span class="en">Challengers, come up!</span></div>
      <div><span class="ac-n">2</span><b class="ko">앉은 친구들은 몸으로!</b><span class="en">Everyone else, act it out!</span></div>
      <div><span class="ac-n">3</span><b class="ko">도전자는 영어로!</b><span class="en">Challengers, say it in English!</span></div>
    </div>
    <div class="ac-score ko">⏱️ 제한 시간 안에 <b>맞힌 문장 수</b>가 기록돼요. ${AC_POOL.length}문장을 <b>모두 맞히면 걸린 시간</b>이 기록돼요!
      <span class="en">Your score is how many sentences you get in time. Get all ${AC_POOL.length} and your time is recorded!</span></div>
    <div class="row" style="justify-content:center;margin:18px 0;gap:12px">
      <span class="ko" style="font-size:24px">반 <span class="eni">Class</span></span>
      <select style="font-size:24px;font-family:Jua;padding:6px 10px" onchange="AC.cls=+this.value;acSetup()">${Array.from({ length: 15 }, (_, i) => i + 1).map(c => `<option value="${c}" ${AC.cls === c ? 'selected' : ''}>${c}반</option>`).join('')}</select>
      <span class="ko" style="font-size:24px;margin-left:18px">시간 <span class="eni">Time</span></span>
      ${[30, 60, 90, 120, 180].map(t => `<button class="${AC.time === t ? '' : 'ghost'}" onclick="AC.time=${t};acSetup()">${t}초</button>`).join('')}
    </div>
    <div class="center ko" style="font-size:28px">🏆 ${AC.cls}반 최고 기록 <span class="eni">Best</span> <b style="color:var(--red)">${acFmt(acBest(AC.cls))}</b></div>
    <div class="center" style="margin-top:18px"><button class="red sp-go" onclick="acCount()">도전 시작 ▶<span class="en">Start</span></button></div>
  </div>`;
}
function acCount() {
  let n = 3;
  $app.innerHTML = `<div class="wrap bigscreen"><div class="ac-peek"><div class="ac-warn">도전자는 뒤돌아 서요!<span class="en">Challenger, turn around!</span></div><div class="sp-clock" style="font-size:160px;text-align:center" id="cd">3</div></div></div>`;
  const cd = setInterval(() => { n--; const e = document.getElementById('cd'); if (n <= 0) { clearInterval(cd); acStart(); } else if (e) e.textContent = n; }, 900);
}
function acStart() {
  // 맞힌 문장은 다시 안 나오고, 패스한 문장은 맨 뒤로 돌아가요
  ACG = { deck: shuffle(AC_POOL), time: AC.time, ok: [], pass: [] };
  acDraw();
  stopTimer();
  TMR = setInterval(() => {
    ACG.time--;
    const e = document.getElementById('acTime'); if (e) { e.firstChild.nodeValue = Math.max(0, ACG.time) + '초'; e.classList.toggle('low', ACG.time <= 10); }
    if (ACG.time <= 0) { stopTimer(); acDone(); }
  }, 1000);
}
function acCur() { return ACG.deck[0]; }
function acDraw(flash) {
  const g = ACG, c = acCur();
  const tag = { sick: '🤒 아픈 곳 · Sick', advice: '💊 조언 · Advice', talk: '💬 대화 · Talk' }[c.type];
  $app.innerHTML = `<div class="wrap bigscreen">
    <div class="sp-top"><div class="row" style="gap:14px"><button class="ghost small" onclick="acQuit()">← 처음 <span class="eni">Home</span></button>
      <div class="sp-team">✅ ${g.ok.length}<span class="en">Correct</span></div></div>
      <div class="ko ac-tag ${c.type}">${tag}</div>
      <div class="sp-clock" id="acTime">${g.time}초<small>남은 문장 ${g.deck.length} · ⏭ ${g.pass.length}</small></div></div>
    <div class="ac-big ${flash ? 'pop' : ''}">
      ${pic(c.img, c.emoji)}
      <div><div class="ac-sent">${esc(c.en)}</div><div class="ac-ko">${esc(c.ko)}</div></div>
    </div>
    <div class="ac-note ko">🙈 도전자는 보지 마세요! 앉은 친구들은 말없이 몸으로! <span class="eni">Challengers, don't look! Act without words!</span></div>
    <div class="row" style="justify-content:center;gap:24px;margin-top:10px">
      <button class="ghost sp-go" onclick="acNext(false)">⏭ 패스 · 반칙<span class="en">Pass · Foul</span></button>
      <button class="sp-go" style="background:var(--ok);box-shadow:0 5px 0 #1f7a4b" onclick="acNext(true)">✅ 정답!<span class="en">Correct!</span></button>
    </div>
  </div>`;
}
function acQuit() {
  uiConfirm('도전을 그만하고 처음으로 갈까요? (기록되지 않아요)\nGo home? (Not recorded)', () => { stopTimer(); ACG = null; home(); });
}
function acNext(ok) {
  const g = ACG; if (!g || g.time <= 0 || g.done) return;
  const c = g.deck.shift();
  if (ok) { g.ok.push(c); sfx('ok'); }
  else { g.pass.push(c); g.deck.push(c); sfx('pass'); }
  if (!g.deck.length) { stopTimer(); return acDone(true); }
  acDraw(true);
}
function acDone(allClear) {
  const g = ACG; if (!g || g.done) return; g.done = true;
  const n = g.ok.length, used = AC.time - Math.max(0, g.time);
  const rec = allClear ? { n, t: used } : { n, t: null };
  const best = acBest(AC.cls), isBest = n > 0 && acBetter(rec, best);
  if (isBest) acSetBest(AC.cls, rec);
  sfx('end');
  const passedLeft = g.pass.filter(c => !g.ok.includes(c)).filter((c, i, a) => a.indexOf(c) === i);
  const all = [...g.ok.map(c => [c, true]), ...passedLeft.map(c => [c, false])];
  $app.innerHTML = `<div class="wrap bigscreen">
    <div class="center">
      <div class="sp-team">${allClear ? '🎉 모든 문장 성공!' : `${AC.cls}반 도전 끝!`}<span class="en">${allClear ? `All ${n} sentences cleared!` : 'Time is up!'}</span></div>
      <div class="sp-clock" style="font-size:110px;text-align:center;margin:4px 0">${allClear ? `${used}초` : `${n}개`}</div>
      <div class="ko" style="font-size:26px">${isBest ? '🏆 새 반 최고 기록! <span class="eni">New class best!</span>' : `🏆 반 최고 기록 ${acFmt(best)}`}</div>
    </div>
    <div class="panel" style="margin-top:12px">
      <div class="ko" style="font-size:24px;margin-bottom:8px">다 같이 읽어요 <span class="eni">Read together</span></div>
      <div class="ac-list">${all.map(([c, ok]) => `<button class="ghost ${ok ? '' : 'passed'}" onclick='speak(${esc(JSON.stringify(c.en))})'>${ok ? '✅' : '⏭'} ${esc(c.en)}</button>`).join('') || '<span class="muted">-</span>'}</div>
    </div>
    <div class="row" style="justify-content:center;gap:16px;margin-top:12px">
      <button class="ghost" onclick="home()">← 처음<span class="en">Home</span></button>
      <button class="sun sp-go" onclick="acSetup()">다시 도전 ▶<span class="en">Try again</span></button>
    </div>
  </div>`;
}

route();
window.addEventListener('hashchange', () => { if (/#f=/.test(location.hash)) route(); });
</script>
